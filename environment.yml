# Local development environment for Agenthon Track 2.
name: agenthon_mars
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.1.3
      - pandas==2.2.3
      - pyarrow==18.1.0
      - jsonschema==4.23.0
      - "qfbench2-common[data] @ https://github.com/Agenthon-2026/Agenthon2026-public/archive/refs/tags/v2.6.0.tar.gz#subdirectory=common"
      - "-e ./track2-forecasting-public[test]"
      - scipy
      - matplotlib
      - ipykernel
